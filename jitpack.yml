# JitPack build: Java 25 is not a stock JitPack JDK, install it via SDKMAN
before_install:
  - JAVA_ID=$(sdk list java | grep -o "25\.[0-9.]*-tem" | head -1) && sdk install java "$JAVA_ID" && sdk use java "$JAVA_ID"
install:
  - java -version
  - ./mvnw --batch-mode --no-transfer-progress install -DskipTests
